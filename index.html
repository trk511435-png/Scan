<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مسح الغرفة - نظام الواقع الافتراضي</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #111; color: #fff; text-align: center; padding-top: 50px; }
        button { background: #4CAF50; color: white; border: none; padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 8px; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <h1>نظام مسح وتجهيز الغرفة</h1>
    <p>اضغط على الزر أدناه لبدء مسح الأثاث الأساسي وتخطي الفوضى وغرف النوم المغلقة:</p>
    <br>
    <button id="startScanBtn">بدء مسح الغرفة الآن</button>

    <script>
        document.getElementById('startScanBtn').addEventListener('click', async () => {
            if (navigator.xr) {
                try {
                    // طلب جلسة WebXR مع دعم ميزات مسح المكان إن توفرت
                    const session = await navigator.xr.requestSession('immersive-ar', {
                        requiredFeatures: ['hit-test', 'local-floor']
                    });
                    
                    alert('جاري مسح الأثاث الثابت فقط (كنب، طاولات، تلفزيون)... يرجى التحرك في الغرفة.');
                    
                    // محاكاة استخراج البيانات وتصفيتها برمجياً
                    setTimeout(() => {
                        const rawScannedData = {
                            rooms: [{ type: 'living_room', name: 'الصالة الرئيسية' }],
                            furniture: [
                                { type: 'COUCH', position: {x: 0, y: 0, z: -2}, dimensions: {width: 2, height: 0.8, depth: 0.9} },
                                { type: 'TABLE', position: {x: 1, y: 0, z: -1.5}, dimensions: {width: 1.2, height: 0.5, depth: 0.6} },
                                { type: 'TV_SCREEN', position: {x: 0, y: 1.2, z: -3}, dimensions: {width: 1.4, height: 0.8, depth: 0.1} }
                            ]
                        };

                        // تصفية العناصر المتجاهلة (الأشخاص، الأوساخ، المليس، الغرف الأخرى)
                        const cleanData = filterUnwantedObjects(rawScannedData);
                        
                        // حفظ البيانات المؤقتة والتحول للعبة التنظيف
                        localStorage.setItem('cleanHouseMap', JSON.stringify(cleanData));
                        alert('تم مسح الغرفة وتصفيتها بنجاح! سيتم الانتقال للعبة التنظيف.');
                        window.location.href = 'game.html';
                    }, 3000);

                } catch (e) {
                    alert('عذراً، متصفح النظارة لا يدعم وضع الرفع المباشر أو تم رفض الإذن: ' + e.message);
                }
            } else {
                alert('خاصية WebXR غير مدعومة في هذا المتصفح.');
            }
        });

        function filterUnwantedObjects(data) {
            // كود الفلترة لضمان جلب الأثاث المطلوب فقط
            const allowedTypes = ['COUCH', 'TABLE', 'TV_SCREEN'];
            data.furniture = data.furniture.filter(item => allowedTypes.includes(item.type));
            return data;
        }
    </script>
</body>
</html>
