<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الماسح الضوئي الفضائي - الواقع المختلط</title>
    <style>
        :root {
            --bg-color: #050b14;
            --card-bg: rgba(15, 23, 42, 0.85);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            background-image: radial-gradient(circle at 50% 20%, #1e1b4b 0%, var(--bg-color) 70%);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .scanner-container {
            width: 100%;
            max-width: 550px;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px var(--accent-glow);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: scanLine 3s linear infinite;
        }

        @keyframes scanLine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .btn-core {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 12px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-core:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }

        #gameLinkBtn {
            background: linear-gradient(135deg, #059669, #10b981);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            display: none;
        }

        .status-box {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            color: #fbbf24;
        }

        pre {
            background: #020617;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            direction: ltr;
            max-height: 180px;
            overflow-y: auto;
            font-size: 12px;
            color: #34d399;
            margin-top: 20px;
        }

        .color-badge {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 5px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="scanner-container">
        <div class="card">
            <h1>الماسح الضوئي الذكي للأثاث</h1>
            <p>استشعار أبعاد الأماكن، استخراج مساقط الأثاث، وتحليل الألوان الحية بدقة عالية.</p>
            
            <button class="btn-core" id="startScanBtn">🚀 بدء التشغيل والمسح المكاني</button>
            <div class="status-box" id="statusText">الحالة: بانتظار تفعيل نظام الواقع المختلط...</div>

            <pre id="jsonOutput">// بيانات الأثاث والألوان ستظهر هنا فور إتمام المسح...</pre>

            <button class="btn-core" id="gameLinkBtn" onclick="goToGame()">🎮 الدخول إلى بيئة اللعب والتنظيف</button>
        </div>
    </div>

    <script>
        let finalCleanData = null;

        document.getElementById('startScanBtn').addEventListener('click', async () => {
            const statusText = document.getElementById('statusText');
            
            if (navigator.xr) {
                try {
                    statusText.innerText = "جاري تهيئة حساسات الواقع الافتراضي والمعزز...";
                    
                    // طلب جلسة غامرة مع تفعيل ميزات تتبع البيئة (حسب دعم النظارة)
                    const sessionOptions = {
                        requiredFeatures: ['hit-test', 'local-floor']
                    };
                    
                    const session = await navigator.xr.requestSession('immersive-ar', sessionOptions);
                    statusText.innerText = "جاري مسح السطح واستخراج الأثاث وألوانه...";
                    
                    // محاكاة استشعار البيانات المتقدمة مع خوارزمية تحليل الألوان
                    setTimeout(() => {
                        const rawScannedData = {
                            device: "Meta Quest / XR Device",
                            furniture: [
                                { 
                                    type: 'COUCH', 
                                    position: { x: 0.1, y: 0.0, z: -2.2 }, 
                                    dimensions: { width: 2.3, height: 0.85, depth: 0.95 },
                                    estimatedColor: { hex: "#4158D0", name: "Modern Blue" }
                                },
                                { 
                                    type: 'TABLE', 
                                    position: { x: 1.4, y: 0.0, z: -1.7 }, 
                                    dimensions: { width: 1.1, height: 0.45, depth: 0.6 },
                                    estimatedColor: { hex: "#8B5CF6", name: "Deep Violet" }
                                },
                                { 
                                    type: 'TV_SCREEN', 
                                    position: { x: 0.0, y: 1.4, z: -3.0 }, 
                                    dimensions: { width: 1.6, height: 0.9, depth: 0.1 },
                                    estimatedColor: { hex: "#1E293B", name: "Obsidian Black" }
                                }
                            ]
                        };

                        // تصفية ومعالجة البيانات قبل الإرسال
                        finalCleanData = {
                            timestamp: new Date().toISOString(),
                            totalItems: rawScannedData.furniture.length,
                            furniture: rawScannedData.furniture
                        };
                        
                        // عرض النتيجة بالتنسيق الجميل
                        document.getElementById('jsonOutput').innerText = JSON.stringify(finalCleanData, null, 2);
                        statusText.innerText = "تم المسح واستخراج الألوان بنجاح تام! جاري الرفع للسحاب...";
                        
                        // حفظ محلي
                        localStorage.setItem('scannedHouseMap', JSON.stringify(finalCleanData));

                        // إرسال البيانات مباشرة لسيرفر Render الخاص بك
                        fetch('https://game-4jxf.onrender.com/api/save-house', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(finalCleanData)
                        })
                        .then(res => res.json())
                        .then(serverRes => {
                            statusText.innerText = "✨ تم حفظ وبث التصميم إلى سيرفر Render بنجاح!";
                            document.getElementById('gameLinkBtn').style.display = 'block';
                        })
                        .catch(err => {
                            statusText.innerText = "⚠️ تم المسح محلياً، ولكن فشل الاتصال بالسيرفر السحابي.";
                            document.getElementById('gameLinkBtn').style.display = 'block';
                        });

                    }, 3000);

                } catch (e) {
                    statusText.innerText = "خطأ في تشغيل الجلسة: " + e.message;
                }
            } else {
                statusText.innerText = "تنبيه: متصفحك لا يدعم WebXR (افتح الصفحة من نظارة الكويست).";
            }
        });

        function goToGame() {
            // توجيه لرابط اللعبة المستقبلي أو إشعار جاهزية النظام
            alert("النظام متصل بالسيرفر وجاهز لبناء اللعبة بناءً على مسح غرفتك الحقيقي!");
        }
    </script>
</body>
</html>
